spring:
  security:
    oauth2:
      client:
        registration:
          my-client:
            authorization-grant-type: client_credentials
            client-id: notification-service
            client-secret: ${NOTIFICATION_SERVICE_PASSWORD}
            scope: server
            provider: my-auth
        provider:
          my-auth:
            token-uri: http://auth-service:5000/uaa/oauth/token
  data:
    mongodb:
      uri: mongodb://app_user:${MONGODB_PASSWORD}@notification-service-db:27017/notification?authSource=notification
  mail:
    host: smtp.gmail.com
    port: 465
    username: dev-user
    password: dev-password
    properties:
      mail:
        smtp:
          auth: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          ssl:
            enable: true
  cloud:
    openfeign:
      oauth2:
        enabled: true
        clientRegistrationId: my-client
      # If you want Feign methods wrapped with circuit breakers, uncomment:
      # circuitbreaker:
      #   enabled: true

server:
  servlet:
    context-path: /notifications
  port: 8000

remind:
  cron: 0 0 0 * * *
  email:
    text: "Hey, {0}! We''ve missed you here on PiggyMetrics. It''s time to check your budget statistics.\r\n\r\nCheers,\r\nPiggyMetrics team"
    subject: PiggyMetrics reminder

backup:
  cron: 0 0 12 * * *
  email:
    text: "Howdy, {0}. Your account backup is ready.\r\n\r\nCheers,\r\nPiggyMetrics team"
    subject: PiggyMetrics account backup
    attachment: backup.json

