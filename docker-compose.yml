name: piggymetrics

services:
  config:
    build:
      context: ./config
    environment:
      CONFIG_SERVICE_PASSWORD: $CONFIG_SERVICE_PASSWORD
    ports:
      - "8888:8888"

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: always
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # HTTP management UI
    environment:
      RABBITMQ_DEFAULT_USER: def_user
      RABBITMQ_DEFAULT_PASS: def_password
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  account-service:
    build:
      context: ./account-service
    environment:
      CONFIG_SERVICE_PASSWORD: $CONFIG_SERVICE_PASSWORD
      ACCOUNT_SERVICE_PASSWORD: $ACCOUNT_SERVICE_PASSWORD
      MONGODB_PASSWORD: $MONGODB_PASSWORD
    ports:
      - "6000:6000"
    depends_on:
      config:
        condition: service_started
      account-service-db:
        condition: service_healthy

  account-service-db:
    image: mongo:7
    restart: always
    ports:
      - "26000:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: piggy_account_admin
      MONGO_INITDB_ROOT_PASSWORD: piggy_account_password
      MONGO_INITDB_DATABASE: accounts
      MONGODB_APP_USER: app_user
      MONGODB_APP_PASSWORD: $MONGODB_PASSWORD
    volumes:
      - account-service-db-data:/data/db
      - ./.docker/mongo/init/:/docker-entrypoint-initdb.d/:ro
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -lc 'echo > /dev/tcp/127.0.0.1/27017'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
  
  statistics-service:
    build:
      context: ./statistics-service
    environment:
      CONFIG_SERVICE_PASSWORD: $CONFIG_SERVICE_PASSWORD
      ACCOUNT_SERVICE_PASSWORD: $ACCOUNT_SERVICE_PASSWORD
      MONGODB_PASSWORD: $MONGODB_PASSWORD
    ports:
      - "7050:7050"
    depends_on:
      config:
        condition: service_started
      account-service-db:
        condition: service_healthy
  
  statistics-service-db:
    image: mongo:7
    restart: always
    ports:
      - "27000:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: piggy_statistics_admin
      MONGO_INITDB_ROOT_PASSWORD: piggy_statistics_password
      MONGO_INITDB_DATABASE: statistics
      MONGODB_APP_USER: app_user
      MONGODB_APP_PASSWORD: $MONGODB_PASSWORD
    volumes:
      - statistics-service-db-data:/data/db
      - ./.docker/mongo/statistics-init/:/docker-entrypoint-initdb.d/:ro
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -lc 'echo > /dev/tcp/127.0.0.1/27017'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
  
  notification-service-db:
    image: mongo:7
    restart: always
    ports:
      - "28000:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: piggy_notification_admin
      MONGO_INITDB_ROOT_PASSWORD: piggy_notification_password
      MONGO_INITDB_DATABASE: notification
      MONGODB_APP_USER: app_user
      MONGODB_APP_PASSWORD: $MONGODB_PASSWORD
    volumes:
      - notification-service-db-data:/data/db
      - ./.docker/mongo/notif-init/:/docker-entrypoint-initdb.d/:ro
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -lc 'echo > /dev/tcp/127.0.0.1/27017'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  rabbitmq-data:
  account-service-db-data:
  statistics-service-db-data:
  notification-service-db-data:



